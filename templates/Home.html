<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Student Exam Performance Predictor</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Bootstrap 5 -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- Google Font -->
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap"
      rel="stylesheet"
    />

    <style>
      body {
        font-family: "Poppins", sans-serif;
        background: linear-gradient(120deg, #0f172a, #1e293b);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .card {
        width: 100%;
        max-width: 700px;
        border: none;
        border-radius: 16px;
        box-shadow: 0 25px 50px rgba(0, 0, 0, 0.25);
        background: #ffffff;
      }

      .card-header {
        background: linear-gradient(135deg, #2563eb, #1e40af);
        color: #ffffff;
        padding: 25px;
        text-align: center;
        border-radius: 16px 16px 0 0;
      }

      .card-header h1 {
        font-size: 1.8rem;
        font-weight: 600;
        margin-bottom: 5px;
      }

      .card-header p {
        font-size: 0.95rem;
        opacity: 0.9;
      }

      .form-label {
        font-weight: 500;
        color: #1f2937;
      }

      .form-control,
      .form-select {
        border-radius: 10px;
        padding: 10px 14px;
      }

      .btn-primary {
        background: linear-gradient(135deg, #2563eb, #1e40af);
        border: none;
        border-radius: 12px;
        padding: 12px;
        font-weight: 600;
        transition: all 0.3s ease;
      }

      .btn-primary:hover {
        transform: translateY(-2px);
        box-shadow: 0 10px 25px rgba(37, 99, 235, 0.4);
      }

      .result-box {
        margin-top: 25px;
        padding: 18px;
        background: #f1f5f9;
        border-left: 6px solid #2563eb;
        border-radius: 10px;
        font-weight: 600;
        color: #0f172a;
        text-align: center;
      }

      footer {
        text-align: center;
        margin-top: 20px;
        font-size: 0.85rem;
        color: #64748b;
      }
      .btn-secondary-outline {
        background: transparent;
        color: #1e40af;
        font-weight: 600;
        font-size: 0.95rem;
        padding: 12px 24px;
        border: 2px solid #c7d2fe;
        border-radius: 12px;
        transition: all 0.25s ease;
      }

      .btn-secondary-outline:hover {
        background: #eef2ff;
        border-color: #1e40af;
        color: #1e40af;
        transform: translateY(-2px);
      }

      .btn-cta:focus,
      .btn-secondary-outline:focus {
        outline: none;
        box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.3);
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="card-header">
        <h1>Student Exam Performance Indicator</h1>
        <p>Machine Learning Based Maths Score Prediction</p>
      </div>
      <div class="text-center mt-4">
        <a href="{{ url_for('index') }}" class="btn btn-secondary-outline">
          ← Back to Home
        </a>
      </div>

      <div class="card-body p-4">
        <form action="{{ url_for('predict_datapoint') }}" method="post">
          <div class="row g-3">
            <div class="col-md-6">
              <label class="form-label">Gender</label>
              <select class="form-select" name="gender" required>
                <option selected disabled value="">Select Gender</option>
                <option value="male">Male</option>
                <option value="female">Female</option>
              </select>
            </div>

            <div class="col-md-6">
              <label class="form-label">Race / Ethnicity</label>
              <select class="form-select" name="ethnicity" required>
                <option selected disabled value="">Select Ethnicity</option>
                <option value="group A">Group A</option>
                <option value="group B">Group B</option>
                <option value="group C">Group C</option>
                <option value="group D">Group D</option>
                <option value="group E">Group E</option>
              </select>
            </div>

            <div class="col-md-6">
              <label class="form-label">Parental Education</label>
              <select
                class="form-select"
                name="parental_level_of_education"
                required
              >
                <option selected disabled value="">
                  Select Education Level
                </option>
                <option value="associate's degree">Associate's Degree</option>
                <option value="bachelor's degree">Bachelor's Degree</option>
                <option value="high school">High School</option>
                <option value="master's degree">Master's Degree</option>
                <option value="some college">Some College</option>
                <option value="some high school">Some High School</option>
              </select>
            </div>

            <div class="col-md-6">
              <label class="form-label">Lunch Type</label>
              <select class="form-select" name="lunch" required>
                <option selected disabled value="">Select Lunch Type</option>
                <option value="free/reduced">Free / Reduced</option>
                <option value="standard">Standard</option>
              </select>
            </div>

            <div class="col-md-6">
              <label class="form-label">Test Preparation Course</label>
              <select
                class="form-select"
                name="test_preparation_course"
                required
              >
                <option selected disabled value="">Select Option</option>
                <option value="none">None</option>
                <option value="completed">Completed</option>
              </select>
            </div>

            <div class="col-md-6">
              <label class="form-label">Reading Score (0–100)</label>
              <input
                type="number"
                class="form-control"
                name="reading_score"
                min="0"
                max="100"
                required
              />
            </div>

            <div class="col-md-6">
              <label class="form-label">Writing Score (0–100)</label>
              <input
                type="number"
                class="form-control"
                name="writing_score"
                min="0"
                max="100"
                required
              />
            </div>
          </div>

          <div class="d-grid mt-4">
            <button type="submit" class="btn btn-primary">
              Predict Maths Score
            </button>
          </div>
        </form>

        {% if results %}
        <div class="result-box">
          📊 Predicted Maths Score: <strong>{{ results }}</strong>
        </div>
        {% endif %}
      </div>
    </div>
  </body>
</html>
